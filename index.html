<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parky &amp; Habbi — A Birthday Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,800;0,900;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <img id="bg" src="assets/background.jpg" alt="">

      <img id="banner" class="prop" src="assets/banner.png" alt="Happy Birthday banner">
      <img id="presents-l" class="prop" src="assets/presents-l.png" alt="">
      <img id="presents-r" class="prop" src="assets/presents-r.png" alt="">

      <div id="parky" class="char"><img alt="Parky"></div>
      <div id="habbi" class="char hidden">
        <img class="sprite" alt="Habbi">
        <img class="carry hidden" src="assets/cake.png" alt="">
      </div>

      <img id="bowl-blue" class="prop" src="assets/bowl-blue.png" alt="">
      <img id="bowl-green" class="prop" src="assets/bowl-green.png" alt="">
      <img id="cake" class="prop" src="assets/cake.png" alt="Birthday cake">
      <img id="slice" class="prop" src="assets/slice.png" alt="Slice of cake">

      <button id="card" class="prop" type="button" aria-label="Open the birthday card">
        <span class="card-heart">&#9829;</span>
        <span class="card-to">For Daddy</span>
      </button>

      <div id="choices" class="hidden"></div>

      <div id="textbox" class="hidden">
        <div id="name"></div>
        <div id="inner">
          <p id="text"></p>
          <span id="hint">space &#9662;</span>
        </div>
      </div>

      <div id="card-overlay" class="hidden">
        <div id="bigcard">
          <div id="card-inside">
            <p id="card-greeting"></p>
            <p id="card-body"></p>
            <p id="card-wish"></p>
            <p id="card-sign"></p>
          </div>
          <div id="card-cover">
            <span class="card-heart">&#9829;</span>
            <span class="card-to">For Daddy</span>
          </div>
        </div>
        <div id="card-hint">press space to put the card down</div>
      </div>

      <div id="end-hint" class="hidden">press R to play again</div>

      <div id="title">
        <h1>Parky &amp; Habbi</h1>
        <p class="sub">a birthday story</p>
        <p class="start" id="start-hint">loading…</p>
      </div>

      <div id="fade"></div>
    </div>
  </div>

  <script src="story.js?v=4"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
